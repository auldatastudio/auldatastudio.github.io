    <text x="32" y="78" font-size="12" fill="#55606E">Ringkasan operasional · Februari</text>

    <rect x="462" y="34" width="146" height="28" rx="14" fill="#EAF1EC"/>
    <circle cx="480" cy="48" r="3.5" fill="#0F5132"/>
    <text x="492" y="52" font-size="11" font-weight="600" fill="#0F5132">Diperbarui otomatis</text>

    <g>
