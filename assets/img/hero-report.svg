<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Ilustrasi laporan bulanan dengan kartu ringkasan, grafik tren, dan rincian kategori">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F5132" stop-opacity=".22"/>
