    <line x1="60" y1="366" x2="580" y2="366" stroke="#D8D8CF"/>

    <path d="M60 340 L147 322 L234 300 L321 310 L408 282 L495 268 L580 250 L580 366 L60 366 Z" fill="url(#area)"/>
    <polyline points="60,340 147,322 234,300 321,310 408,282 495,268 580,250" fill="none" stroke="#0F5132" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#D9A404" stroke="#FFFFFF" stroke-width="1.6">
