<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="Ilustrasi sampul laporan: dokumen Power BI tiga halaman">
  <rect width="560" height="340" fill="#F3F7F4"/>
  <g font-family="'Plus Jakarta Sans', Segoe UI, Arial, sans-serif">

    <!-- halaman belakang -->
    <rect x="168" y="58" width="236" height="248" rx="10" fill="#FFFFFF" stroke="#DCE4DF"/>
    <rect x="152" y="46" width="236" height="248" rx="10" fill="#FFFFFF" stroke="#E1E7E3"/>

    <!-- halaman depan -->
    <rect x="136" y="34" width="252" height="266" rx="10" fill="#FFFFFF" stroke="#D9E2DC"/>

    <!-- kepala dokumen -->
    <path d="M136 44a10 10 0 0 1 10-10h232a10 10 0 0 1 10 10v34H136z" fill="#0F5132"/>
    <text x="156" y="56" font-size="8" font-weight="700" fill="#8FB79F" letter-spacing="1.4">POWER BI REPORT</text>
    <text x="156" y="70" font-size="13" font-weight="800" fill="#FFFFFF">DIAD Final Report</text>
    <rect x="336" y="50" width="34" height="18" rx="4" fill="#D9A404"/>
    <text x="353" y="62.5" font-size="8" font-weight="800" fill="#2A1F00" text-anchor="middle">PDF</text>

    <!-- isi halaman -->
    <g fill="#EDF1EE">
      <rect x="156" y="88" width="120" height="7" rx="3.5"/>
      <rect x="156" y="100" width="86" height="7" rx="3.5"/>
    </g>
    <g fill="#E4E9E5">
      <rect x="156" y="120" width="212" height="76" rx="6"/>
    </g>
    <g fill="#0F5132">
      <rect x="172" y="168" width="18" height="18" rx="3" opacity=".35"/>
      <rect x="198" y="152" width="18" height="34" rx="3" opacity=".55"/>
      <rect x="224" y="160" width="18" height="26" rx="3" opacity=".45"/>
      <rect x="250" y="140" width="18" height="46" rx="3"/>
      <rect x="276" y="158" width="18" height="28" rx="3" opacity=".5"/>
      <rect x="302" y="148" width="18" height="38" rx="3" opacity=".7"/>
      <rect x="328" y="164" width="18" height="22" rx="3" opacity=".4"/>
    </g>
    <g fill="#E4E9E5">
      <rect x="156" y="208" width="102" height="6" rx="3"/>
      <rect x="156" y="222" width="212" height="6" rx="3"/>
      <rect x="156" y="236" width="180" height="6" rx="3"/>
      <rect x="156" y="250" width="212" height="6" rx="3"/>
      <rect x="156" y="264" width="140" height="6" rx="3"/>
    </g>

    <!-- keterangan -->
    <g>
      <rect x="404" y="196" width="120" height="72" rx="10" fill="#FFFFFF" stroke="#E1E7E3"/>
      <text x="420" y="218" font-size="9" font-weight="700" fill="#8A929E" letter-spacing=".8">ISI</text>
      <text x="420" y="234" font-size="10.5" fill="#111827">3 halaman</text>
      <text x="420" y="250" font-size="10.5" fill="#111827">Laporan analisis</text>
    </g>
  </g>
</svg>
